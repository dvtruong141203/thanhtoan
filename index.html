<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hóa đơn thanh toán</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

      :root {
        --vcb-green: #006934;
        --vcb-light: #e8f5e9;
        --text-main: #0f172a;
        --text-sub: #64748b;
        --bg-body: #f1f5f9; /* Nền xám nhạt cao cấp */
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background: var(--bg-body); 
        background-image: radial-gradient(at 50% 0%, #e0f2fe 0px, transparent 50%), radial-gradient(at 100% 100%, #dcfce7 0px, transparent 50%);
        min-height: 100vh; display: flex; justify-content: center; align-items: center; 
        padding: 16px; color: var(--text-main); position: relative;
      }

      /* Khung Hóa Đơn (Receipt Card) */
      .app-wrapper { 
        background: var(--card-bg); width: 100%; max-width: 400px; 
        border-radius: 28px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 0 1px rgba(0,0,0,0.1);
        position: relative; overflow: hidden; display: none; /* Chờ load API */
        animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .header-line { height: 6px; width: 100%; background: linear-gradient(90deg, #7ebc42, #006934); }

      @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

      /* Loader lúc mới vào web */
      .global-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; height: 100vh; position: absolute; width: 100%; top:0; left:0;}
      .spinner-large { width: 44px; height: 44px; border: 4px solid rgba(0,105,52,0.15); border-top-color: var(--vcb-green); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;}
      .loader-text { font-size: 15px; font-weight: 600; color: var(--text-main); letter-spacing: -0.3px;}

      /* Tiêu đề & Căn lề trong Card */
      .screen-container { padding: 32px 24px; }
      .brand-title { font-size: 14px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; text-align: center; margin-bottom: 8px;}
      
      /* Phần nổi bật (Top Section: Số tiền + QR) */
      .top-section { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .main-amount { font-size: 36px; font-weight: 800; color: var(--vcb-green); letter-spacing: -1.5px; margin-bottom: 24px; line-height: 1.1;}
      
      .qr-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; position: relative; transition: all 0.4s ease;}
      .qr-frame { background: #ffffff; padding: 12px; border-radius: 20px; border: 2px solid var(--border-color); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05); position: relative; z-index: 2; }
      .qr-frame img { width: 170px; height: 170px; border-radius: 12px; display: block; }
      
      /* Đường đứt nét chia hóa đơn (Ticket Cutout) */
      .divider { width: 100%; height: 0; border-top: 2px dashed #cbd5e1; margin: 24px 0; position: relative; }
      .divider::before, .divider::after { content: ''; position: absolute; top: -12px; width: 24px; height: 24px; background: var(--bg-body); border-radius: 50%; box-shadow: inset 0 0 2px rgba(0,0,0,0.05); }
      .divider::before { left: -36px; }
      .divider::after { right: -36px; }

      /* Banner Trạng thái (Hiện khi Success/Failed) */
      .status-banner { text-align: center; padding: 20px; border-radius: 20px; margin-bottom: 8px; display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 100%;}
      .banner-success { background: #ecfdf5; border: 1px solid #10b981; }
      .banner-failed { background: #fef2f2; border: 1px solid #ef4444; }
      .status-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; color: white; }
      .icon-success { background: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
      .icon-failed { background: #ef4444; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); }
      .banner-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; color: var(--text-main);}
      .banner-desc { font-size: 14px; font-weight: 500; color: var(--text-sub);}
      @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

      /* Danh sách Thông tin chi tiết */
      .info-list { display: flex; flex-direction: column; gap: 16px; }
      .info-row { display: flex; justify-content: space-between; align-items: center; }
      .label { font-size: 13.5px; color: var(--text-sub); font-weight: 500; }
      .value { font-size: 14px; font-weight: 700; color: var(--text-main); text-align: right; max-width: 65%; word-break: break-word; line-height: 1.3;}
      .val-group { display: flex; align-items: center; gap: 8px; justify-content: flex-end;}
      .highlight-time { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-weight: 600; color: #475569;}
      .time-success { color: #10b981; }

      /* Nút copy tối giản, thanh lịch */
      .btn-copy { background: #f8fafc; border: 1px solid #e2e8f0; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); transition: 0.2s ease; flex-shrink: 0; }
      .btn-copy:hover { color: var(--vcb-green); border-color: var(--vcb-green); background: var(--vcb-light); transform: translateY(-1px);}
      .btn-copy.copied { background: var(--vcb-green); color: #ffffff; border-color: var(--vcb-green); transform: scale(1.05); }

      /* Trạng thái Text nhỏ */
      .badge-pending { color: #2563eb; background: #eff6ff; padding: 4px 10px; border-radius: 12px; font-size: 12px;}
      .badge-success { color: #10b981; background: #ecfdf5; padding: 4px 10px; border-radius: 12px; font-size: 12px;}
      .badge-failed { color: #ef4444; background: #fef2f2; padding: 4px 10px; border-radius: 12px; font-size: 12px;}

      /* Khu vực thao tác (Action Area) */
      .action-area { margin-top: 24px; display: flex; flex-direction: column; align-items: center; }
      .sync-text { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-sub); font-weight: 600; margin-bottom: 16px;}
      .sync-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: pulseGreen 1.5s infinite; }
      @keyframes pulseGreen { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.5; } }

      .btn-main { background: var(--text-main); color: #ffffff; border: none; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 16px; width: 100%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.3); }
      .btn-main:hover { box-shadow: 0 12px 24px -5px rgba(15, 23, 42, 0.4); transform: translateY(-2px); }
      .btn-main:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
      
      .loader-spinner { width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .manual-error { color: #ef4444; font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; display: none; }
    </style>
  </head>
  <body>

    <!-- Màn hình chờ Load API -->
    <div id="global-loading" class="global-loader">
      <div class="spinner-large"></div>
      <div class="loader-text">Đang tải hóa đơn...</div>
    </div>

    <!-- Khung chính -->
    <div class="app-wrapper" id="app-wrapper">
      <div class="header-line"></div>

      <!-- Màn hình lỗi -->
      <div id="screen-error" class="screen-container" style="display: none; text-align: center;">
        <svg viewBox="0 0 24 24" width="60" height="60" stroke="#ef4444" stroke-width="2" fill="none" style="margin-bottom: 16px; margin-top: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <div style="font-size: 22px; font-weight: 800; margin-bottom: 8px; color: var(--text-main);">Lỗi tra cứu</div>
        <div style="color: #ef4444; font-size: 14px; font-weight: 500;" id="error-msg-text"></div>
      </div>

      <!-- Màn hình Hóa Đơn -->
      <div id="screen-main" class="screen-container" style="display: none;">
        <div class="brand-title">Biên lai thanh toán</div>
        
        <div class="top-section">
          <!-- Số tiền nổi bật -->
          <div class="main-amount" id="val-amount">0 đ</div>

          <!-- Banner trạng thái (Ẩn khi Pending) -->
          <div id="status-banner" class="status-banner">
            <div id="banner-icon" class="status-icon"></div>
            <div id="banner-title" class="banner-title"></div>
            <div id="banner-desc" class="banner-desc"></div>
          </div>

          <!-- Mã QR (Ẩn khi Success/Failed) -->
          <div class="qr-area" id="qr-section">
            <div class="qr-frame">
              <img id="qr-image" src="" alt="QR Code">
            </div>
          </div>
        </div>

        <!-- Đường cắt hóa đơn -->
        <div class="divider"></div>
        
        <!-- Bảng thông tin chi tiết -->
        <div class="info-list">
          <div class="info-row">
            <span class="label">Mã giao dịch</span>
            <div class="val-group">
              <span class="value" id="val-id"></span>
              <button class="btn-copy" onclick="copyText('val-id', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>
          
          <div class="info-row">
            <span class="label">Ngân hàng</span>
            <div class="val-group">
              <span class="value" id="val-bank" data-raw="VIETCOMBANK" style="color: var(--vcb-green); font-weight: 800;">VIETCOMBANK</span>
              <button class="btn-copy" onclick="copyText('val-bank', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>

          <div class="info-row">
            <span class="label">Số tài khoản</span>
            <div class="val-group">
              <span class="value" id="val-stk" data-raw="TEG60603130946VCB">TEG60603130946VCB</span>
              <button class="btn-copy" onclick="copyText('val-stk', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>

          <div class="info-row">
            <span class="label">Chủ tài khoản</span>
            <div class="val-group">
              <span class="value" id="val-name" data-raw="DINH VIET TRUONG">DINH VIET TRUONG</span>
              <button class="btn-copy" onclick="copyText('val-name', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>

          <div class="info-row" style="display: none;" id="row-amount-copy">
             <span class="label">Số tiền</span>
             <div class="val-group">
               <span class="value" id="val-amount-raw">0 đ</span>
               <button class="btn-copy" onclick="copyText('val-amount-raw', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
             </div>
          </div>

          <div class="info-row">
            <span class="label">Nội dung</span>
            <div class="val-group">
              <span class="value" id="val-content"></span>
              <button class="btn-copy" onclick="copyText('val-content', this)"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>

          <div class="info-row">
            <span class="label">Thời gian tạo</span>
            <span class="value highlight-time" id="val-created"></span>
          </div>

          <div class="info-row">
            <span class="label">Thời gian T.Toán</span>
            <span class="value highlight-time" id="val-paid">---</span>
          </div>

          <div class="info-row">
            <span class="label">Trạng thái</span>
            <span class="value" id="val-status"></span>
          </div>
        </div>

        <!-- Khu vực nút bấm (Ẩn khi Success/Failed) -->
        <div class="action-area" id="action-section">
          <div class="sync-text">
            <div class="sync-dot"></div> Đang kiểm tra tự động...
          </div>
          <button class="btn-main" onclick="checkStatusManual()" id="btnCheckStatus">
            <div class="loader-spinner" id="btnLoader"></div>
            <span id="btnText">Đã chuyển khoản</span>
          </button>
          <div id="manual-error" class="manual-error">Chưa nhận được thanh toán. Vui lòng kiểm tra lại!</div>
        </div>
        
      </div>
    </div>

    <script>
      // LINK API
      const API_URL = "https://script.google.com/macros/s/AKfycbzOxkqvXRnuzC-Ek8AUlutoAm7jsSgAYG-lGi8g0kxoV4UZ7FSIf7lCePQw3334ltubqw/exec";
      
      let transactionId = null;
      let checkInterval = null;

      window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        transactionId = urlParams.get('id');
        
        if (!transactionId) {
          showError("Vui lòng cung cấp mã giao dịch trên URL (Ví dụ: ?id=260717187210)");
          return;
        }
        fetchTransactionData();
      };

      function fetchTransactionData() {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            if (data.status === "success" && data.data) {
              const item = data.data.find(row => String(row["Mã giao dịch"]).trim() === String(transactionId).trim());
              if (item) renderDataToUI(item);
              else showError("Không tìm thấy thông tin cho mã giao dịch: " + transactionId);
            } else {
              showError("Lỗi kết nối từ máy chủ API.");
            }
          })
          .catch(() => showError("Lỗi mạng: Không thể tải dữ liệu."));
      }

      function renderDataToUI(item) {
        document.getElementById("global-loading").style.display = "none";
        document.getElementById("app-wrapper").style.display = "block";
        document.getElementById("screen-main").style.display = "block";

        const rawAmount = String(item["Số tiền"]).replace(/[^\d]/g, ''); 
        const rawContent = item["Nội dung"];
        
        // Cập nhật text
        document.getElementById('val-id').innerText = item["Mã giao dịch"];
        document.getElementById('val-id').setAttribute('data-raw', item["Mã giao dịch"]);
        
        // Đưa số tiền lên to đùng trên cùng
        document.getElementById('val-amount').innerText = item["Số tiền"] + " đ";
        
        // Dòng số tiền trong bảng (để copy)
        document.getElementById('val-amount-raw').innerText = item["Số tiền"] + " đ";
        document.getElementById('val-amount-raw').setAttribute('data-raw', rawAmount);
        
        document.getElementById('val-content').innerText = rawContent;
        document.getElementById('val-content').setAttribute('data-raw', rawContent);
        document.getElementById('val-created').innerText = item["Thời gian tạo"] || "---";

        // QR Code BIN VCB 970436
        document.getElementById('qr-image').src = `https://img.vietqr.io/image/970436-TEG60603130946VCB-qr_only.png?amount=${rawAmount}&addInfo=${encodeURIComponent(rawContent)}&accountName=DINH%20VIET%20TRUONG`;

        updateStatusUI(item["Trạng thái"], item["Thời gian thanh toán"]);
      }

      // Xử lý Giao diện theo Trạng thái (Hiện/Ẩn QR và Nút)
      function updateStatusUI(statusText, paidTimeText) {
        const statusClean = statusText.trim().toLowerCase();
        
        document.getElementById('val-status').innerText = statusText;
        document.getElementById('val-paid').innerText = (paidTimeText === "---" || !paidTimeText) ? "---" : paidTimeText;
        
        const qrSection = document.getElementById('qr-section');
        const actionSection = document.getElementById('action-section');
        const banner = document.getElementById('status-banner');
        const bannerIcon = document.getElementById('banner-icon');
        const bannerTitle = document.getElementById('banner-title');
        const bannerDesc = document.getElementById('banner-desc');
        const paidTimeEl = document.getElementById('val-paid');
        const statusEl = document.getElementById('val-status');
        const amountCopyRow = document.getElementById('row-amount-copy');

        if (statusClean === "đã thanh toán") {
          statusEl.className = "value badge-success";
          paidTimeEl.classList.add("time-success"); 
          qrSection.style.display = "none"; 
          actionSection.style.display = "none"; 
          amountCopyRow.style.display = "none"; // Ẩn nút copy tiền vì đã xong
          
          // Hiện Banner Thành công
          banner.className = "status-banner banner-success";
          bannerIcon.className = "status-icon icon-success";
          bannerIcon.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="4" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>';
          bannerTitle.innerText = "Thanh toán thành công";
          bannerDesc.innerText = "Hóa đơn đã được xác nhận điện tử.";
          banner.style.display = "block";
          
          if (checkInterval) clearInterval(checkInterval);
          
        } else if (statusClean === "thất bại" || statusClean === "thanh toán thất bại") {
          statusEl.className = "value badge-failed";
          paidTimeEl.classList.remove("time-success");
          qrSection.style.display = "none"; 
          actionSection.style.display = "none"; 
          amountCopyRow.style.display = "none";
          
          // Hiện Banner Thất bại
          banner.className = "status-banner banner-failed";
          bannerIcon.className = "status-icon icon-failed";
          bannerIcon.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="4" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
          bannerTitle.innerText = "Giao dịch thất bại";
          bannerDesc.innerText = "Giao dịch đã bị huỷ hoặc hết thời gian.";
          banner.style.display = "block";
          
          if (checkInterval) clearInterval(checkInterval);
          
        } else {
          // Đang chờ thanh toán
          statusEl.className = "value badge-pending";
          paidTimeEl.classList.remove("time-success");
          qrSection.style.display = "flex"; 
          actionSection.style.display = "flex"; 
          amountCopyRow.style.display = "flex"; // Hiện để khách copy số tiền thủ công
          banner.style.display = "none";
          
          startPolling();
        }
      }

      function startPolling() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
          fetch(API_URL)
            .then(res => res.json())
            .then(data => {
              if (data.status === "success" && data.data) {
                const item = data.data.find(r => String(r["Mã giao dịch"]).trim() === String(transactionId).trim());
                if (item) updateStatusUI(item["Trạng thái"], item["Thời gian thanh toán"]);
              }
            }).catch(e => console.log(e));
        }, 3000); 
      }

      function checkStatusManual() {
        const btn = document.getElementById('btnCheckStatus');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('btnLoader');
        const errBox = document.getElementById('manual-error');
        
        errBox.style.display = "none";
        btnText.innerText = "Đang xử lý...";
        loader.style.display = "block";
        btn.disabled = true;

        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            const item = data.data.find(r => String(r["Mã giao dịch"]).trim() === String(transactionId).trim());
            if (item) {
              const st = item["Trạng thái"].trim().toLowerCase();
              if (st === "đã thanh toán" || st === "thất bại") {
                updateStatusUI(item["Trạng thái"], item["Thời gian thanh toán"]);
              } else {
                errBox.style.display = "block";
                btnText.innerText = "Đã chuyển khoản";
                loader.style.display = "none";
                btn.disabled = false;
              }
            }
          })
          .catch(() => {
            btnText.innerText = "Đã chuyển khoản";
            loader.style.display = "none";
            btn.disabled = false;
          });
      }

      function showError(msg) {
        document.getElementById("global-loading").style.display = "none";
        document.getElementById("app-wrapper").style.display = "block";
        document.getElementById("screen-main").style.display = "none";
        document.getElementById("screen-error").style.display = "block";
        document.getElementById("error-msg-text").innerText = msg;
      }

      function copyText(elementId, btn) {
        const el = document.getElementById(elementId);
        const textToCopy = el.getAttribute('data-raw') || el.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
          const svgCopy = '<svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
          const svgCheck = '<svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>';
          
          btn.innerHTML = svgCheck;
          btn.classList.add("copied");
          setTimeout(() => {
            btn.innerHTML = svgCopy;
            btn.classList.remove("copied");
          }, 2000);
        });
      }
    </script>
