<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin thanh toán</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
    body{background:#f5f7fa;display:flex;justify-content:center;padding:2rem;min-height:100vh}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:2rem;max-width:420px;width:100%}
    .logo{width:64px;height:64px;border-radius:12px;object-fit:cover;margin-bottom:1rem}
    h2{font-size:1.25rem;color:#1a1a1a;margin-bottom:1.5rem}
    .row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid #eee}
    .row:last-child{border-bottom:none}
    .label{font-weight:500;color:#666;font-size:.9rem}
    .value{color:#1a1a1a;font-weight:600;text-align:right;font-size:.9rem;word-break:break-all;max-width:65%}
    .copy-btn{background:#eef2ff;color:#4f46e5;border:none;border-radius:8px;padding:.5rem 1rem;margin-top:1rem;cursor:pointer;font-weight:600;width:100%;transition:.2s}
    .copy-btn:hover{background:#e0e7ff}
    .copy-btn.copied{background:#10b981;color:#fff}
    .status{display:inline-block;background:#d1fae5;color:#065f46;padding:.25rem .75rem;border-radius:20px;font-size:.8rem;font-weight:600;margin-top:.5rem}
    .empty{color:#999;text-align:center;padding:2rem 0}
  </style>
</head>
<body>
  <div class="card">
    <div id="content"></div>
  </div>

  <script>
    // Dữ liệu tham chiếu — bạn có thể mở rộng thêm nhiều ID khác
    const dataBank = {
      "BK746543": {
        bankName: "MoMo",
        bin: "971025",
        accNumber: "9342839952",
        accOwner: "DINH VIET TRUONG",
        status: "Hoạt động",
        logo: "https://cdn.vietqr.io/img/momo.png"
      }
      // Thêm ở đây: "ID_KHAC": { ... }
    };

    // Lấy giá trị ?id= từ URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const content = document.getElementById("content");

    if (!id || !dataBank[id]) {
      content.innerHTML = `<p class="empty">❌ Không tìm thấy thông tin. Vui lòng kiểm tra lại đường link!</p>`;
    } else {
      const d = dataBank[id];
      content.innerHTML = `
        <img src="${d.logo}" alt="${d.bankName}" class="logo" onerror="this.style.display='none'">
        <h2>${d.bankName}</h2>
        <div class="row"><span class="label">Mã BIN</span><span class="value">${d.bin}</span></div>
        <div class="row"><span class="label">Số tài khoản</span><span class="value" id="accNumber">${d.accNumber}</span></div>
        <div class="row"><span class="label">Chủ tài khoản</span><span class="value" id="accOwner">${d.accOwner}</span></div>
        <div class="row"><span class="label">Trạng thái</span><span class="value"><span class="status">${d.status}</span></span></div>
        <button class="copy-btn" onclick="copyAll()">📋 Sao chép thông tin</button>
      `;
    }

    function copyAll() {
      const d = dataBank[id];
      const text = `Ngân hàng: ${d.bankName}
Số tài khoản: ${d.accNumber}
Chủ tài khoản: ${d.accOwner}`;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "✅ Đã sao chép!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "📋 Sao chép thông tin";
          btn.classList.remove("copied");
        }, 2000);
      });
    }
  </script>
</body>
</html>
